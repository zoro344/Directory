name: Build Anime Streaming App

on:
  push:
    branches:
      - anime-streaming-app
    paths:
      - 'anime_streaming_app/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: anime_streaming_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-streaming-release-apk
          path: anime_streaming_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
